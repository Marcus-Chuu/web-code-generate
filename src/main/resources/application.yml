spring:
  application:
    name: WebCodeGenerate

  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/marcus_ai_code
    username: xxx
    password: xxxxxx
  profiles:
    active: prod

  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600  # 缓存过期时间（秒）

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>


# Mermaid CLI 配置
mermaid:
  # 可通过环境变量指定 mmdc 或 mmdc.cmd 的绝对路径
  cli-path: ${MERMAID_CLI_PATH:mmdc}
  timeout-seconds: ${MERMAID_CLI_TIMEOUT_SECONDS:60}
  # 留空时 Windows 会自动查找系统 Chrome，避免使用损坏的 Puppeteer 浏览器缓存
  browser-executable-path: ${MERMAID_BROWSER_EXECUTABLE_PATH:}

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      timeout: 5m
      log-requests: true
      log-responses: true
      max-tokens: 8192
      max-retries: 3
    # 流式输出
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <Your API Key>
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: true
      log-responses: true

# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wan2.2-t2i-flash

# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name

# 应用访问地址
app:
  deploy:
    # 可通过环境变量 APP_DEPLOY_BASE_URL 覆盖，不要以 / 结尾
    base-url: ${APP_DEPLOY_BASE_URL:http://localhost/api/static}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.marcuschu.webcodegenerate.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

