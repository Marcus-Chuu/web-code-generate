<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>· 暖咖 · 醇香之旅</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-cream: #fdf6ef;
      --bg-warm: #f6e5d5;
      --coffee-dark: #3b2b1e;
      --coffee-brown: #5f4433;
      --amber-light: #e2b284;
      --amber-mid: #c98f5e;
      --caramel: #a9672d;
      --soft-white: #fffaf4;
      --shadow-sm: 0 8px 20px rgba(100, 60, 30, 0.08);
      --shadow-md: 0 16px 32px rgba(110, 65, 30, 0.12);
      --radius-lg: 2rem;
      --radius-md: 1.2rem;
      --radius-btn: 3rem;
      --transition-all: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    body {
      background-color: var(--bg-cream);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      color: var(--coffee-dark);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 1.8rem;
      width: 100%;
    }

    /* 头部导航 */
    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.5rem 0 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--coffee-dark);
      letter-spacing: -0.5px;
    }

    .logo-icon {
      background: var(--amber-mid);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      box-shadow: 0 6px 10px rgba(80, 45, 20, 0.15);
    }

    .nav-links {
      display: flex;
      gap: 2.2rem;
      font-weight: 500;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--coffee-brown);
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: var(--transition-all);
      font-size: 1.05rem;
    }

    .nav-links a:hover {
      color: var(--caramel);
      border-bottom-color: var(--amber-light);
    }

    .nav-cta {
      background: var(--coffee-brown);
      color: var(--soft-white);
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition-all);
      box-shadow: var(--shadow-sm);
    }

    .nav-cta:hover {
      background: var(--caramel);
      transform: translateY(-2px);
      box-shadow: 0 8px 14px rgba(150, 90, 40, 0.25);
    }

    /* 主视觉 Hero */
    .hero {
      background: linear-gradient(120deg, #f9e6d2 0%, #efd6bd 100%);
      border-radius: 0 0 3rem 3rem;
      padding: 4rem 0 4.5rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .hero-grid {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 3rem;
    }

    .hero-text {
      flex: 1 1 300px;
    }

    .hero-text h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .highlight {
      background: linear-gradient(130deg, var(--amber-mid) 15%, var(--caramel) 90%);
      padding: 0 0.5rem;
      border-radius: 0.5rem;
      color: white;
      display: inline-block;
      transform: rotate(-1deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .hero-text p {
      font-size: 1.2rem;
      color: #4d3929;
      margin-bottom: 2.2rem;
      border-left: 5px solid var(--amber-light);
      padding-left: 1.2rem;
      background: rgba(255,250,240,0.6);
      padding: 0.8rem 1.2rem;
      border-radius: 0.6rem;
      backdrop-filter: blur(2px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .btn-group {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: var(--transition-all);
      border: 2px solid transparent;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--coffee-brown);
      color: white;
      box-shadow: 0 8px 18px rgba(90, 50, 20, 0.2);
    }

    .btn-primary:hover {
      background: var(--caramel);
      transform: translateY(-4px);
      box-shadow: 0 12px 22px rgba(90, 50, 20, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--coffee-dark);
      color: var(--coffee-dark);
    }

    .btn-outline:hover {
      background: var(--coffee-dark);
      color: white;
    }

    .hero-image {
      flex: 1 1 280px;
      max-width: 360px;
      margin: 0 auto;
      background: var(--bg-warm);
      border-radius: 3rem;
      padding: 0.6rem;
      transform: rotate(3deg);
      box-shadow: var(--shadow-md);
    }

    .hero-image img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      border-radius: 2.5rem;
      display: block;
    }

    /* 商品区域 */
    .product-section {
      padding: 2.5rem 0 1.5rem;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .section-title span {
      width: 14px;
      height: 30px;
      background: var(--amber-light);
      border-radius: 40px;
    }

    .section-sub {
      color: #7a5c46;
      margin-bottom: 2.6rem;
      font-size: 1.05rem;
      max-width: 70%;
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem 1.6rem;
    }

    .coffee-card {
      background: var(--soft-white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid rgba(195, 130, 80, 0.15);
      box-shadow: var(--shadow-sm);
      transition: var(--transition-all);
      display: flex;
      flex-direction: column;
      animation: cardIn 0.5s ease backwards;
    }

    .coffee-card:hover {
      transform: translateY(-10px);
      box-shadow: var(--shadow-md);
      border-color: var(--amber-light);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 4px solid var(--amber-light);
      transition: transform 0.5s ease;
    }

    .coffee-card:hover .card-img {
      transform: scale(1.03);
    }

    .card-body {
      padding: 1.5rem 1.3rem 1.5rem;
      display: flex;
      flex: 1;
      flex-direction: column;
    }

    .tag {
      background: var(--bg-warm);
      color: var(--coffee-brown);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 2rem;
      width: fit-content;
      margin-bottom: 0.8rem;
      letter-spacing: 0.3px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
      line-height: 1.3;
    }

    .card-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--caramel);
      margin: 0.3rem 0;
    }

    .card-desc {
      font-size: 0.95rem;
      color: #5c473a;
      margin-bottom: 1.3rem;
      flex: 1;
    }

    .card-btn {
      background: transparent;
      border: 2px solid var(--amber-mid);
      color: var(--amber-mid);
      font-weight: 600;
      padding: 0.7rem 1rem;
      border-radius: 3rem;
      cursor: pointer;
      transition: var(--transition-all);
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      text-align: center;
      margin-top: 0.4rem;
    }

    .card-btn:hover {
      background: var(--amber-mid);
      color: white;
      border-color: var(--amber-mid);
    }

    /* 促销横幅优化 */
    .banner-msg {
      background: linear-gradient(135deg, #d99f6c 0%, #b97c4a 100%);
      border-radius: 2.2rem;
      color: white;
      padding: 1.5rem 2rem;
      margin: 3rem 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: 0 12px 24px rgba(150, 90, 40, 0.2);
    }

    .banner-text {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .banner-text small {
      display: block;
      font-weight: 400;
      opacity: 0.9;
    }

    .btn-promo {
      background: white;
      color: var(--caramel);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition-all);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-promo:hover {
      background: #f0efe7;
      transform: scale(1.03);
    }

    /* 页脚 */
    footer {
      background: var(--coffee-dark);
      color: #ebd8c6;
      margin-top: 3rem;
      padding: 2.2rem 0 1.8rem;
      border-radius: 3rem 3rem 0 0;
    }

    .footer-flex {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .footer-links {
      display: flex;
      gap: 2rem;
    }

    .footer-links a {
      color: #d4b89f;
      text-decoration: none;
      font-size: 1rem;
      transition: var(--transition-all);
    }

    .footer-links a:hover {
      color: white;
      text-decoration: underline;
    }

    .social-icons {
      display: flex;
      gap: 1.2rem;
      font-size: 1.5rem;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 响应式 */
    @media (max-width: 820px) {
      .hero-text h1 { font-size: 2.3rem; }
      .section-sub { max-width: 100%; }
      .nav-links { display: none; }
      .hero-grid { flex-direction: column-reverse; text-align: center; }
      .hero-text p { text-align: left; }
      .btn-group { justify-content: center; }
    }

    @media (max-width: 520px) {
      .card-grid { grid-template-columns: 1fr; }
      .banner-msg { flex-direction: column; text-align: center; }
      .btn-promo { width: 100%; }
      .footer-flex { flex-direction: column; text-align: center; }
      .social-icons { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- 导航 -->
  <header>
    <div class="container nav-wrap">
      <div class="logo">
        <span class="logo-icon">☕</span>
        <span>暖咖</span>
      </div>
      <div class="nav-links">
        <a href="#products">商品</a>
        <a href="#banner">限时特惠</a>
        <a href="#foot">我们的故事</a>
      </div>
      <button class="nav-cta" id="navBtn">一杯好咖啡</button>
    </div>
  </header>

  <!-- HERO 更注重香气与体验 -->
  <section class="hero">
    <div class="container hero-grid">
      <div class="hero-text">
        <h1>唤醒清晨的<br>是那抹<span class="highlight">醇厚与温暖</span></h1>
        <p>☕ 每日新鲜烘焙 · 精品阿拉比卡 <br> 带着焦糖、可可与太妃糖的暖调香气。</p>
        <div class="btn-group">
          <a href="#products" class="btn btn-primary">探索咖啡豆</a>
          <a href="#" class="btn btn-outline" onclick="alert('订阅方案即将上线，敬请期待～'); return false;">订阅计划</a>
        </div>
      </div>
      <div class="hero-image">
        <img src="https://picsum.photos/seed/coffeehouse/400/280" alt="手冲咖啡与新鲜烘焙豆">
      </div>
    </div>
  </section>

  <!-- 商品卡片区 -->
  <section class="product-section container" id="products">
    <h2 class="section-title"><span></span> 匠心风味</h2>
    <p class="section-sub">每一款豆子都来自高海拔庄园，小批量慢烘焙，保留最自然的香气层次。</p>

    <div class="card-grid" id="cardGrid">
      <!-- 由js动态渲染，更好维护 -->
    </div>

    <!-- 优惠横幅 -->
    <div class="banner-msg" id="banner">
      <span class="banner-text">🎉 全店满¥199 免运费 <small>额外再享9折 · 限时特惠</small></span>
      <button class="btn-promo" id="promoBtn">领取专属优惠</button>
    </div>
  </section>

  <!-- 页脚 -->
  <footer id="foot">
    <div class="container footer-flex">
      <div style="font-weight: 600;">暖咖啡 · 烘焙于城市一隅</div>
      <div class="footer-links">
        <a href="#">关于我们</a>
        <a href="#">咖啡文化</a>
        <a href="#">配送</a>
        <a href="#">联系</a>
      </div>
      <div class="social-icons">
        <span>📘</span>
        <span>📸</span>
        <span>🐦</span>
      </div>
    </div>
  </footer>

  <!-- JS -->
  <script>
    (function(){
      // 产品数据 —— 丰富描述，更吸引人
      const products = [
        {
          title: '耶加雪菲 · 花语',
          price: '¥128 / 250g',
          desc: '茉莉与佛手柑，明亮果酸如橙皮，口感干净甜美，冷热皆宜。',
          tag: '🌸 浅烘 · 花果调',
          img: 'https://picsum.photos/seed/yirga2024/400/280'
        },
        {
          title: '哥伦比亚 · 坚果可可',
          price: '¥108 / 250g',
          desc: '焦糖、烤坚果，醇厚顺滑，愉悦的平衡感，是每日口粮首选。',
          tag: '🌰 中烘 · 平衡',
          img: 'https://picsum.photos/seed/colombia2024/400/280'
        },
        {
          title: '曼特宁 · 黑森林',
          price: '¥138 / 250g',
          desc: '黑巧克力、雪松与香料，厚重饱满，回甘有烟熏尾韵。适合重口味。',
          tag: '🔥 深烘 · 醇厚',
          img: 'https://picsum.photos/seed/mandehling2024/400/280'
        },
        {
          title: '危地马拉 · 火山庄园',
          price: '¥118 / 250g',
          desc: '可可、肉桂与一丝烟丝感，油脂丰富，口感圆润且层次复杂。',
          tag: '🍫 中深烘 · 层次',
          img: 'https://picsum.photos/seed/guatemala2024/400/280'
        }
      ];

      // 渲染卡片
      const grid = document.getElementById('cardGrid');
      function renderProducts() {
        if (!grid) return;
        let items = '';
        products.forEach((p, idx) => {
          items += `
            <article class="coffee-card" style="animation-delay: ${idx * 0.1}s">
              <img src="${p.img}" alt="咖啡：${p.title}" class="card-img" loading="lazy">
              <div class="card-body">
                <span class="tag">${p.tag}</span>
                <h3 class="card-title">${p.title}</h3>
                <div class="card-price">${p.price}</div>
                <p class="card-desc">${p.desc}</p>
                <button class="card-btn" data-product="${p.title}">加入购物车 · 尝鲜</button>
              </div>
            </article>
          `;
        });
        grid.innerHTML = items;

        // 绑定卡片按钮事件
        grid.querySelectorAll('.card-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            const product = this.dataset.product || '咖啡';
            alert(`🛒 “${product}” 已加入购物车 (演示)`);
          });
        });
      }

      // 按钮绑定
      function bindActions() {
        // 优惠券按钮
        const promoBtn = document.getElementById('promoBtn');
        if (promoBtn) {
          promoBtn.addEventListener('click', () => {
            alert('🎁 使用优惠码 COFFEE10 可享额外9.5折！');
          });
        }

        // 导航 CTA
        const navBtn = document.getElementById('navBtn');
        if (navBtn) {
          navBtn.addEventListener('click', () => {
            alert('☕ 欢迎来店品尝，或浏览我们最新风味豆。');
          });
        }
      }

      // 平滑锚点
      function smoothScroll() {
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
          anchor.addEventListener('click', function (e) {
            const id = this.getAttribute('href');
            if (id === '#') return;
            const target = document.querySelector(id);
            if (target) {
              e.preventDefault();
              target.scrollIntoView({ behavior: 'smooth' });
            }
          });
        });
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', () => {
        renderProducts();
        bindActions();
        smoothScroll();
      });
    })();
  </script>
</body>
</html>
